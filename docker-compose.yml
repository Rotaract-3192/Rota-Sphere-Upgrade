services:
  rotasphere:
    image: rotaract/rotasphere:latest
    container_name: rotasphere

    build:
      context: .
      args:
        NEXT_PUBLIC_OLA_MAPS_API_KEY: ${NEXT_PUBLIC_OLA_MAPS_API_KEY}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    restart: unless-stopped

    expose:
      - "3000"

    env_file:
      - .env

    environment:
      - OCR_SERVICE_URL=http://ocr:5055/scan

    depends_on:
      - ocr

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - default
      - rotaract

  ocr:
    container_name: rotasphere-ocr
    build:
      context: .
      dockerfile: Dockerfile.ocr
    restart: unless-stopped
    expose:
      - "5055"
    networks:
      - default

networks:
  default:

  rotaract:
    external: true
